[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "affine-observatory"
version = "0.1.0"
authors = [{name = "Melis Derveni"}, {name = "Harsimranjeet Kaur"}]
requires-python = ">=3.10"
dependencies = ["numpy>=2,<3", "matplotlib>=3.10,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
report = ["playwright>=1.50,<2", "pypdf>=6,<7"]

[project.scripts]
observatory-analyse = "calib.analysis:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
