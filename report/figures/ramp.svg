<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#233431">
  <defs>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a77f42"/>
    </marker>
  </defs>
  <!-- table and wall -->
  <line x1="10" y1="140" x2="262" y2="140" stroke="#a77f42" stroke-width="2.5"/>
  <line x1="250" y1="140" x2="250" y2="20" stroke="#a77f42" stroke-width="2.5"/>
  <rect x="250" y="20" width="12" height="120" fill="#f5f0e5"/>
  <!-- phone leaning at 30 degrees: bottom at (77,140), top touching the wall at (250,40) -->
  <g transform="rotate(-30 77 140)">
    <rect x="77" y="132" width="200" height="8" rx="2" fill="#fff" stroke="#233431" stroke-width="1.5"/>
    <rect x="79" y="132" width="196" height="2.6" fill="#23665e"/>
    <text x="177" y="124" text-anchor="middle">phone, L = 16 cm</text>
  </g>
  <!-- height -->
  <line x1="285" y1="137" x2="285" y2="43" stroke="#a77f42" stroke-width="1.5" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <line x1="262" y1="40" x2="292" y2="40" stroke="#a77f42" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="296" y="94" fill="#a77f42" font-weight="bold">h</text>
  <!-- angle -->
  <path d="M117,140 A40,40 0 0 0 111.6,120" fill="none" stroke="#23665e" stroke-width="1.5"/>
  <text x="122" y="133" fill="#23665e" font-weight="bold">θ</text>
  <text x="160" y="162" text-anchor="middle" fill="#66736e" font-size="11">sin θ = h / L</text>
</svg>
